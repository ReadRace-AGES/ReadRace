services:
  db:
    image: postgres:16-alpine
    container_name: readrace-db
    environment:
      POSTGRES_DB: readrace
      POSTGRES_USER: readrace
      POSTGRES_PASSWORD: readrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readrace -d readrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: