# =============================================================
# Profile: dev
#
# Ativado por:
#   * ./mvnw spring-boot:run  (o plugin já força o profile dev)
#   * docker compose          (SPRING_PROFILES_ACTIVE=dev no .env)
#
# Usa o mock local de livros (LocalBooksAdapter), ativado pelo @Profile("dev").
# O seed de livros está em books-seed.json no classpath. Não precisa de API key
# do Google neste profile.
#
# Nada aqui deve valer em produção.
# =============================================================

spring:
  config:
    # Lê o .env da raiz (o mesmo do docker compose) quando a API roda pelo ./mvnw, cujo diretório
    # é backend/. Assim o modo de login (AUTH_MODO e COGNITO_*) se troca no .env, sem export.
    # Variável exportada no terminal tem prioridade sobre o arquivo. No container o arquivo não
    # existe ("optional"): lá o compose já passa as variáveis.
    import: "optional:file:../.env[.properties]"

readrace:
  cors:
    # Em dev o app roda em Expo web, emulador e device físico — cada um
    # com uma origem diferente. Em produção, listar os domínios reais.
    allowed-origins: "*"

logging:
  level:
    # Mostra o SQL gerado pelo Hibernate durante o desenvolvimento.
    org.hibernate.SQL: debug
    # Mostra o VALOR de cada parâmetro da query. Útil para depurar,
    # e exatamente por isso nunca pode subir em produção: quando houver
    # autenticação, e-mail e hash de senha apareceriam no log.
    org.hibernate.orm.jdbc.bind: trace
