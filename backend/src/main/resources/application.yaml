spring:
  application:
    name: readrace-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/readrace}
    username: ${DB_USER:readrace}
    password: ${DB_PASSWORD:readrace}

  jpa:
    hibernate:
      # O Flyway é dono do schema. O Hibernate apenas confere se as entidades
      # batem com as tabelas. NUNCA mudar para "update".
      ddl-auto: validate
    # Evita que a sessão fique aberta durante a renderização da resposta.
    # Com true (padrão), lazy loading funciona "por acidente" no controller
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# ==================== ReadRace ====================
readrace:
  usuario-seed:
    id: ${USUARIO_SEED_ID:00000000-0000-0000-0000-000000000001}
  auth:
    # cognito (padrão) = exige o token do Cognito; é o modo de todos os ambientes.
    # seed = sem login, todo request é o usuario-seed. Só para os testes (src/test/resources/config)
    # ou para rodar sem internet: AUTH_MODO=seed.
    modo: ${AUTH_MODO:cognito}

  # User pool do projeto (us-east-2). Os valores são públicos: identificam o pool, não dão acesso.
  cognito:
    issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-2.amazonaws.com/us-east-2_MEVIpejhy}
    client-id: ${COGNITO_CLIENT_ID:5f06kagodbku0mvveakmsim8qu}
    domain: ${COGNITO_DOMAIN:https://us-east-2mevipejhy.auth.us-east-2.amazoncognito.com}

  cors:
    # Fechado por padrão. Cada ambiente declara as origens que libera —
    # ver application-dev.yaml. Esquecer de configurar em produção deixa a
    # API fechada, em vez de aberta para qualquer origem.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
