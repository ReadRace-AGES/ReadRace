spring:
  application:
    name: readrace-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readrace}
    username: ${DB_USER:readrace}
    password: ${DB_PASSWORD:readrace}

  jpa:
    hibernate:
      # O Flyway é dono do schema. O Hibernate apenas confere se as entidades
      # batem com as tabelas. NUNCA mudar para "update".
      ddl-auto: validate
    # Evita que a sessão fique aberta durante a renderização da resposta.
    # Com true (padrão), lazy loading funciona "por acidente" no controller
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace