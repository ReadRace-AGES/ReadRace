name: Backend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  detecta-mudancas:
    name: Detecta mudanças
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  build:
    name: Build e testes
    needs: detecta-mudancas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do código
        if: needs.detecta-mudancas.outputs.backend == 'true'
        uses: actions/checkout@v4

      - name: Configura JDK 21
        if: needs.detecta-mudancas.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        if: needs.detecta-mudancas.outputs.backend == 'true'
        run: ./mvnw --batch-mode spotless:check verify

      - name: Publica relatório de testes
        if: needs.detecta-mudancas.outputs.backend == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: backend/target/surefire-reports/
          retention-days: 7